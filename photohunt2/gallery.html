<!DOCTYPE html>
<html lang="en">
<head>
<script>/* canonical-host redirect */(function(){var h=location.hostname;if(/\.github\.io$/i.test(h)||/(^|\.)maxwellhowegis\.com$/i.test(h)){location.replace("https://whydahstory.com"+location.pathname.replace(/^\/(Whydah-Unit|whydah)(?=\/|$)/i,"")+location.search+location.hash);}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Hunt 2 Gallery</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14161a">
<link rel="icon" type="image/png" sizes="32x32" href="../pics/favicon-32.png">
<link rel="stylesheet" href="../photo/photo.css">
<style>
  .team-section h2 { border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
  .photo-tile .cap { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header class="site-header">
    <div class="kicker">Photography Unit · Round 2</div>
    <h1>🖼️ Outside Hunt Gallery</h1>
    <div class="crumbs"><a href="../">whydahstory.com</a> / <a href="../photo/">photo</a> / hunt 2 gallery</div>
  </header>

  <p class="muted">Every shot from the field and the park, live as it lands. This is the wall for the end-of-day critique.</p>
  <p class="muted" id="note"></p>

  <div id="gallery"></div>
  <div id="err"></div>

  <nav class="footer-nav">
    <a href="index.html">← Photo Hunt 2</a> · <a href="../photohunt/gallery.html">Round 1 gallery</a> · <a href="../photo/">Photography Unit</a>
  </nav>
</div>

<script src="../photo/photo.js"></script>
<script src="hunt.js"></script>
<script>
async function refresh() {
  let rows;
  try {
    rows = await huntRows();
    document.getElementById('err').textContent = '';
  } catch (e) {
    document.getElementById('err').textContent = '';
    document.getElementById('err').appendChild(el('div', { class: 'error', text: 'Load failed. Will retry.' }));
    return;
  }
  const holder = document.getElementById('gallery');
  holder.textContent = '';
  let any = false;
  for (const t of teamsInRows(rows)) {
    // every shot that landed — only staff-removed photos are hidden
    const shots = rows.filter((r) => r.team === t && r.status !== 'retake')
      .sort((a, b) => a.item_id - b.item_id);
    if (!shots.length) continue;
    any = true;
    const doneItems = new Set(shots.map((r) => r.item_id)).size;
    const grid = el('div', { class: 'photo-grid' });
    for (const r of shots) {
      const url = publicUrl(r.path);
      const img = el('img', { src: url, alt: 'Item ' + r.item_id, loading: 'lazy' });
      img.onclick = () => openLightbox(url, '#' + r.item_id + ' ' + itemText(r.item_id));
      grid.appendChild(el('div', { class: 'photo-tile' }, img,
        el('div', { class: 'tile-bar' }, el('span', { class: 'cap', text: '#' + r.item_id + ' ' + itemText(r.item_id) }))));
    }
    holder.appendChild(el('div', { class: 'team-section' },
      el('h2', { text: 'Team ' + t + ' (' + doneItems + ' of 20)' }), grid));
  }
  if (!any) holder.appendChild(el('p', { class: 'muted', text: 'Nothing yet. The wall fills up as teams get back on WiFi.' }));
  document.getElementById('note').textContent =
    'Photos shot without WiFi land here as soon as that phone reconnects, so this wall keeps filling in after everyone walks back.';
}
refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
