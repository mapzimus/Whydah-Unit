<!DOCTYPE html>
<html lang="en">
<head>
<script>/* canonical-host redirect */(function(){var h=location.hostname;if(/\.github\.io$/i.test(h)||/(^|\.)maxwellhowegis\.com$/i.test(h)){location.replace("https://whydahstory.com"+location.pathname.replace(/^\/(Whydah-Unit|whydah)(?=\/|$)/i,"")+location.search+location.hash);}})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photography Showcase</title>
<meta name="description" content="Final photography showcase slideshow — shuffled student photos with captions.">
<meta name="theme-color" content="#0a0b0d">
<link rel="icon" type="image/png" sizes="32x32" href="../pics/favicon-32.png">
<link rel="stylesheet" href="photo.css">
</head>
<body class="showcase-body">
<div id="lobby" class="showcase-lobby wrap">
  <header class="site-header">
    <div class="kicker">Photography Unit</div>
    <h1>🌟 Showcase Slideshow</h1>
    <div class="crumbs"><a href="../">whydahstory.com</a> / <a href="index.html">photo</a> / showcase</div>
  </header>

  <div class="card">
    <p style="margin:0;">Tomorrow’s gallery show. Photos shuffle into a fresh order every time you hit <strong>Play</strong>. Target length is about <strong>5 minutes</strong>.</p>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;">
      <div>
        <div id="lobby-count" class="muted">Loading submissions…</div>
        <div id="lobby-timing" class="muted" style="margin-top:0.25em;"></div>
      </div>
      <div class="row">
        <button id="refresh-btn" class="secondary">↻ Refresh</button>
        <a class="btn secondary" href="submit.html">Students submit here</a>
        <button id="play-btn" disabled>▶ Play showcase</button>
      </div>
    </div>
  </div>

  <div id="lobby-grid" class="photo-grid"></div>
  <nav class="footer-nav"><a href="index.html">← Photo home</a></nav>
</div>

<div id="stage" class="showcase-stage" hidden>
  <div class="showcase-chrome" id="chrome">
    <div class="showcase-chrome-left">
      <button type="button" id="btn-exit" class="secondary" title="Exit slideshow">✕ Exit</button>
      <span id="stage-progress" class="muted"></span>
    </div>
    <div class="showcase-chrome-right">
      <button type="button" id="btn-prev" class="secondary" title="Previous">‹</button>
      <button type="button" id="btn-toggle" title="Play / Pause">⏸</button>
      <button type="button" id="btn-next" class="secondary" title="Next">›</button>
      <button type="button" id="btn-reshuffle" class="secondary" title="Shuffle and restart">🔀 Shuffle</button>
      <button type="button" id="btn-fs" class="secondary" title="Fullscreen">⛶</button>
    </div>
  </div>

  <div class="showcase-frame" id="frame">
    <img id="slide-img" alt="">
    <div class="showcase-caption-block">
      <div id="slide-caption" class="showcase-caption"></div>
      <div id="slide-credit" class="showcase-credit"></div>
    </div>
  </div>

  <div class="showcase-bar"><div id="slide-bar"></div></div>
  <div id="stage-hint" class="showcase-hint muted">Space play/pause · ← → change slide · Esc exit</div>
</div>

<script src="photo.js"></script>
<script>
const PREFIX = 'showcase';
const TARGET_MS = 5 * 60 * 1000; // ~5 minutes
const MIN_SLIDE_MS = 4000;
const MAX_SLIDE_MS = 12000;

let entries = [];
let deck = [];
let index = 0;
let playing = false;
let slideMs = 8000;
let timer = null;
let barRaf = null;
let slideStarted = 0;
let chromeHideTimer = null;

const lobby = document.getElementById('lobby');
const stage = document.getElementById('stage');
const playBtn = document.getElementById('play-btn');
const lobbyCount = document.getElementById('lobby-count');
const lobbyTiming = document.getElementById('lobby-timing');
const lobbyGrid = document.getElementById('lobby-grid');
const slideImg = document.getElementById('slide-img');
const slideCaption = document.getElementById('slide-caption');
const slideCredit = document.getElementById('slide-credit');
const stageProgress = document.getElementById('stage-progress');
const slideBar = document.getElementById('slide-bar');
const btnToggle = document.getElementById('btn-toggle');

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function computeSlideMs(n) {
  if (n <= 0) return MAX_SLIDE_MS;
  return Math.max(MIN_SLIDE_MS, Math.min(MAX_SLIDE_MS, Math.round(TARGET_MS / n)));
}

function formatMs(ms) {
  const s = Math.round(ms / 1000);
  const m = Math.floor(s / 60);
  const r = s % 60;
  return m + ':' + String(r).padStart(2, '0');
}

async function loadEntries() {
  lobbyCount.textContent = 'Loading submissions…';
  lobbyTiming.textContent = '';
  lobbyGrid.innerHTML = '';
  playBtn.disabled = true;
  try {
    const items = await storageList(PREFIX);
    // Sidecars are JSON text stored as .meta.jpg (bucket only allows image MIME types).
    const sidecars = items.filter(i => i.id !== null && /\.meta\.jpe?g$/i.test(i.name) && !i.name.startsWith('_probe'));
    const loaded = [];
    await Promise.all(sidecars.map(async (j) => {
      try {
        const r = await fetch(publicUrl(PREFIX + '/' + j.name));
        if (!r.ok) return;
        const meta = await r.json();
        if (!meta.photo_path || !meta.student_name || !meta.caption) return;
        if (/_probe|Smoke_Test/i.test(meta.photo_path) || /^Smoke Test$/i.test(meta.student_name)) return;
        loaded.push({
          student_name: meta.student_name,
          caption: meta.caption,
          photo_path: meta.photo_path,
          created_at: meta.created_at || '',
          url: publicUrl(meta.photo_path),
        });
      } catch (_) { /* skip */ }
    }));
    loaded.sort((a, b) => (a.created_at || '').localeCompare(b.created_at || ''));
    entries = loaded;
    const n = entries.length;
    const students = new Set(entries.map(e => e.student_name.trim().toLowerCase())).size;
    slideMs = computeSlideMs(n);
    const onePass = n * slideMs;
    lobbyCount.textContent = n
      ? n + ' photo' + (n === 1 ? '' : 's') + ' from ' + students + ' student' + (students === 1 ? '' : 's')
      : 'No showcase photos yet — students submit from the link above.';
    if (n) {
      let note = 'Each slide ~' + Math.round(slideMs / 1000) + 's · one pass ≈ ' + formatMs(onePass);
      if (onePass < TARGET_MS * 0.9) note += ' · will loop (reshuffled) to fill ~5 minutes';
      else if (onePass > TARGET_MS * 1.15) note += ' · a little over 5 minutes at the minimum slide time';
      else note += ' · about 5 minutes';
      lobbyTiming.textContent = note;
      playBtn.disabled = false;
      for (const e of entries) {
        lobbyGrid.appendChild(el('div', { class: 'photo-tile' },
          el('img', { src: e.url, loading: 'lazy', alt: e.caption, onclick: () => openLightbox(e.url, e.caption + ' — ' + e.student_name) }),
          el('div', { class: 'tile-bar' },
            el('div', { text: e.caption }),
            el('div', { class: 'muted', text: e.student_name }))));
      }
    }
  } catch (e) {
    lobbyCount.innerHTML = '';
    lobbyCount.appendChild(el('div', { class: 'error', text: 'Could not load showcase: ' + e.message }));
  }
}

function buildDeck() {
  deck = shuffle(entries);
  // If one pass is short of ~5 minutes, stack reshuffled loops until we hit the target.
  if (deck.length && deck.length * slideMs < TARGET_MS * 0.9) {
    const need = Math.ceil(TARGET_MS / (deck.length * slideMs));
    let built = deck.slice();
    for (let i = 1; i < need; i++) built = built.concat(shuffle(entries));
    deck = built;
  }
  index = 0;
}

function showSlide(i) {
  if (!deck.length) return;
  index = ((i % deck.length) + deck.length) % deck.length;
  const e = deck[index];
  slideImg.classList.remove('is-in');
  // Force reflow so the fade restarts even when the src is cached
  void slideImg.offsetWidth;
  slideImg.src = e.url;
  slideImg.alt = e.caption;
  slideCaption.textContent = e.caption;
  slideCredit.textContent = e.student_name;
  const capBlock = slideCaption.parentElement;
  capBlock.classList.remove('is-in');
  void capBlock.offsetWidth;
  capBlock.classList.add('is-in');
  stageProgress.textContent = (index + 1) + ' / ' + deck.length;
  slideImg.onload = () => slideImg.classList.add('is-in');
  if (slideImg.complete) slideImg.classList.add('is-in');
  slideStarted = performance.now();
  updateBar();
  // Prefetch next
  const next = deck[(index + 1) % deck.length];
  if (next) { const img = new Image(); img.src = next.url; }
}

function updateBar() {
  if (barRaf) cancelAnimationFrame(barRaf);
  const tick = () => {
    const elapsed = performance.now() - slideStarted;
    const pct = Math.min(100, (elapsed / slideMs) * 100);
    slideBar.style.width = pct + '%';
    if (playing && elapsed < slideMs) barRaf = requestAnimationFrame(tick);
  };
  barRaf = requestAnimationFrame(tick);
}

function clearTimer() {
  if (timer) { clearTimeout(timer); timer = null; }
}

function scheduleNext() {
  clearTimer();
  if (!playing) return;
  const elapsed = performance.now() - slideStarted;
  const remain = Math.max(0, slideMs - elapsed);
  timer = setTimeout(() => {
    if (index + 1 >= deck.length) {
      // End of the ~5-minute program
      pause();
      stageProgress.textContent = 'Done · ' + deck.length + ' slides';
      slideBar.style.width = '100%';
      return;
    }
    showSlide(index + 1);
    scheduleNext();
  }, remain);
}

function play() {
  if (!deck.length) buildDeck();
  if (!deck.length) return;
  playing = true;
  btnToggle.textContent = '⏸';
  showSlide(index);
  scheduleNext();
  bumpChrome();
}

function pause() {
  playing = false;
  btnToggle.textContent = '▶';
  clearTimer();
  if (barRaf) cancelAnimationFrame(barRaf);
}

function enterStage() {
  slideMs = computeSlideMs(entries.length);
  buildDeck();
  lobby.hidden = true;
  stage.hidden = false;
  document.body.classList.add('showcase-playing');
  play();
  bumpChrome();
}

function exitStage() {
  pause();
  stage.hidden = true;
  lobby.hidden = false;
  document.body.classList.remove('showcase-playing');
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  loadEntries();
}

function bumpChrome() {
  document.body.classList.add('chrome-visible');
  clearTimeout(chromeHideTimer);
  chromeHideTimer = setTimeout(() => {
    if (playing) document.body.classList.remove('chrome-visible');
  }, 2800);
}

playBtn.onclick = enterStage;
document.getElementById('refresh-btn').onclick = loadEntries;
document.getElementById('btn-exit').onclick = exitStage;
document.getElementById('btn-toggle').onclick = () => {
  if (playing) pause();
  else {
    playing = true;
    btnToggle.textContent = '⏸';
    scheduleNext();
    updateBar();
  }
  bumpChrome();
};
document.getElementById('btn-next').onclick = () => { showSlide(index + 1); if (playing) scheduleNext(); bumpChrome(); };
document.getElementById('btn-prev').onclick = () => { showSlide(index - 1); if (playing) scheduleNext(); bumpChrome(); };
document.getElementById('btn-reshuffle').onclick = () => {
  buildDeck();
  playing = true;
  btnToggle.textContent = '⏸';
  showSlide(0);
  scheduleNext();
  bumpChrome();
};
document.getElementById('btn-fs').onclick = () => {
  if (!document.fullscreenElement) stage.requestFullscreen().catch(() => {});
  else document.exitFullscreen().catch(() => {});
  bumpChrome();
};

stage.addEventListener('mousemove', bumpChrome);
stage.addEventListener('touchstart', bumpChrome, { passive: true });

document.addEventListener('keydown', (ev) => {
  if (stage.hidden) return;
  if (ev.key === 'Escape') { exitStage(); return; }
  if (ev.key === ' ' || ev.key === 'k') { ev.preventDefault(); document.getElementById('btn-toggle').click(); }
  if (ev.key === 'ArrowRight' || ev.key === 'l') document.getElementById('btn-next').click();
  if (ev.key === 'ArrowLeft' || ev.key === 'j') document.getElementById('btn-prev').click();
  if (ev.key === 'f') document.getElementById('btn-fs').click();
  if (ev.key === 's') document.getElementById('btn-reshuffle').click();
});

loadEntries();
</script>
</body>
</html>
